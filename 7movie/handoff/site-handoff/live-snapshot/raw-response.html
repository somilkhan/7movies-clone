ures numerous stars and members going around various places, playing games, and completing missions. In particular, among the many fun elements of variety shows, this one focuses solely on laughter.\\n\\nOpen your eyes! Big fun is coming in!\\n\\nOpen your mouth! Big laughter is coming in!\\n\\nOpen your heart! Useful lessons are coming in!\",\"logo\":\"/img/t/p/w500/xSWfVTk92R5UJwFZRk4jbwOBCcZ.png\"},{\"id\":106449,\"title\":\"A Record of a Mortal's Journey to Immortality\",\"year\":\"2020\",\"releaseDate\":\"2020-07-25\",\"rating\":8.4,\"backdrop\":\"/img/t/p/w780/8NIvQY34tNPc4txNeym2zEYk9ek.jpg\",\"poster\":\"/img/t/p/w500/u1VRjvvCIVwb1MUhoxSAUimhoKZ.jpg\",\"mediaType\":\"tv\",\"genre\":\"On air\",\"country\":\"China\",\"description\":\"A poor and ordinary boy from a village joins a minor sect in Jiang Hu and becomes an Unofficial Disciple by chance. How will Han Li, a commoner by birth, establish a foothold for himself in his sect? With his mediocre aptitude, he must successfully traverse the treacherous path of cultivation and avoid the notice of those who may do him harm. This is a story of an ordinary mortal who, against all odds, clashes with devilish demons and ancient celestials in order to find his own path towards immortality.\",\"logo\":\"\"}],\"anime\":[{\"id\":233643,\"title\":\"Secret Mission - Undercover Agents Never Back Down!\",\"year\":\"2023\",\"releaseDate\":\"2023-10-02\",\"rating\":6.2,\"backdrop\":\"/img/t/p/w780/5IBSPGPAEFEkEJo4leqvpq0RcKf.jpg\",\"poster\":\"/img/t/p/w500/xZV8e1iKi85PFZlbQBdznvtpAVJ.jpg\",\"mediaType\":\"tv\",\"genre\":\"Anime\",\"country\":\"Japan\",\"description\":\"Narcotics Enforcement Agent Riko Ikazuchi is undercover with her junior colleague Noma in an apartment that serves as the hideout for a criminal organization. Despite Riko and Noma posing as a newlywed couple, the criminals begin to suspect them after not hearing any marital intimacy during the night. To convince them that they are a loving couple, Noma starts xrFATJh9Y.png\"},{\"id\":1539104,\"title\":\"JUJUTSU KAISEN: Execution\",\"year\":\"2025\",\"releaseDate\":\"2025-11-07\",\"rating\":6,\"backdrop\":\"/img/t/p/w780/gtKglOSEq3d4MgQE4VsrT1sRkd0.jpg\",\"poster\":\"/img/t/p/w500/v0s3dx6am0RzfsuK3KdEy8ZoCDs.jpg\",\"mediaType\":\"movie\",\"genre\":\"Anime\",\"country\":\"Japan\",\"description\":\"A veil abruptly descends over the busy Shibuya area amid the bustling Halloween crowds, trapping countless civilians inside. Satoru Gojo, the strongest jujutsu sorcerer, steps into the chaos. But lying in wait are curse users and spirits scheming to seal him away. Yuji Itadori, accompanied by his classmates and other top-tier jujutsu sorcerers, enters the fray in an unprecedented clash of curses — the Shibuya Incident. In the aftermath, ten colonies across Japan are transformed into dens of curses in a plan orchestrated by Noritoshi Kamo. As the deadly Culling Game starts, Special Grade sorcerer Yuta Okkotsu is assigned to carry out Yuji's execution for his perceived crimes. A compilation movie of Shibuya Incident including the first two episodes of the Culling Games arc.\",\"logo\":\"/img/t/p/w500/e3bbEnPJTgFBhV0rCTM368IwUJD.png\"},{\"id\":1545621,\"title\":\"Detective Conan: Fallen Angel of the Highway\",\"year\":\"2026\",\"releaseDate\":\"2026-04-10\",\"rating\":7.8,\"backdrop\":\"/img/t/p/w780/zT5S4GNs8Eu2gIkGORoN6yC1uE2.jpg\",\"poster\":\"/img/t/p/w500/tqlOfb1ekyVYpDumiL9MsK6uirw.jpg\",\"mediaType\":\"movie\",\"genre\":\"Anime\",\"country\":\"Japan\",\"description\":\"When a string of deadly highway incidents begin, Conan Edogawa's investigations point towards an orchestrated plot rather than mere accidents. As he uncovers a conspiracy involving hidden identities and advanced technology, the case escalates into a high-speed race against time to stop a calculating mastermind before more lives are lost.\",\"logo\":\"/img/t/p/w500/8Kw94QfE23D8PtjZcVEi5FFdK9a.png\"},{\"id\":1542877,\"title\":\"Assassination Classroom the Movie: 500/9xjZS2rlVxm8SFx8kPC3aIGCOYQ.jpg\",\"mediaType\":\"movie\",\"genre\":\"Romance movies\",\"country\":\"United States\",\"description\":\"101-year-old Rose DeWitt Bukater tells the story of her life aboard the Titanic, 84 years later. A young Rose boards the ship with her mother and fiancé. Meanwhile, Jack Dawson and Fabrizio De Rossi win third-class tickets aboard the ship. Rose tells the whole story from Titanic's departure through to its death—on its first and last voyage—on April 15, 1912.\",\"logo\":\"/img/t/p/w500/rLzHguwcdni9Jam8rMtMlg5XG2D.png\"},{\"id\":200066,\"title\":\"The Sparrow's Fluttering\",\"year\":\"1988\",\"releaseDate\":\"1988-01-01\",\"rating\":4.2,\"backdrop\":\"/img/t/p/w780/py9wIg0AyUmgXvuDeNuP8OgIVFu.jpg\",\"poster\":\"/img/t/p/w500/8Q5INiyhPf7QxCIcXFWF8QXLPuN.jpg\",\"mediaType\":\"movie\",\"genre\":\"Romance movies\",\"country\":\"Italy\",\"description\":\"A woman, who has been the mistress of a man who has just died, thinks about leaving the little Italian village where they lived and moving to another place. An old and rich man offers her a place in his house, however, she will have to listen to him telling his past love stories.\",\"logo\":\"\"},{\"id\":1595852,\"title\":\"Boulevard\",\"year\":\"2026\",\"releaseDate\":\"2026-04-10\",\"rating\":7.4,\"backdrop\":\"/img/t/p/w780/98uiDns59GUw26SQSCFmuSHTki3.jpg\",\"poster\":\"/img/t/p/w500/hAKOp4AHaDiVdDMlobMNCNgJVD7.jpg\",\"mediaType\":\"movie\",\"genre\":\"Romance movies\",\"country\":\"Spain\",\"description\":\"New city, new life, and an unexpected encounter with Luke-a boy fueled by adrenaline and haunted by demons. Despite the warnings, Hasley can't stay away. In their 'boulevard,' they find a raw, liberating love. But as his past threatens to destroy them both, Hasley faces a heartbreaking choice: can you save someone who isn't ready to be rescued?\",\"logo\":\"/img/t/p/w500/6vJbvjE3aF8N2CRL8I04EWnPnz3.png\"},{\"id\":13,\"title\":\"Forrest Gump\",\"year\":\"1994\",\"releaseDate\":\"1 CIJHjFz2fh4bo6kg1gfE51oENa.png\"},{\"id\":44217,\"title\":\"Vikings\",\"year\":\"2013\",\"releaseDate\":\"2013-03-03\",\"rating\":8.1,\"backdrop\":\"/img/t/p/w780/13kblIK8DnxMurcRDkeyy2sGR7v.jpg\",\"poster\":\"/img/t/p/w500/bQLrHIRNEkE3PdIWQrZHynQZazu.jpg\",\"mediaType\":\"tv\",\"genre\":\"Action \u0026 adventure TV\",\"country\":\"Canada\",\"description\":\"The adventures of Ragnar Lothbrok, the greatest hero of his age. The series tells the sagas of Ragnar's band of Viking brothers and his family, as he rises to become King of the Viking tribes. As well as being a fearless warrior, Ragnar embodies the Norse traditions of devotion to the gods. Legend has it that he was a direct descendant of Odin, the god of war and warriors.\",\"logo\":\"/img/t/p/w500/g4t8s34ONUnxLm7AfgOI82t4ozu.png\"},{\"id\":57243,\"title\":\"Doctor Who\",\"year\":\"2005\",\"releaseDate\":\"2005-03-26\",\"rating\":7.6,\"backdrop\":\"/img/t/p/w780/vcFW09U4834DyFOeRZpsx9x1D3S.jpg\",\"poster\":\"/img/t/p/w500/m6G92osOtSeXwjSfL21jZCUOvxe.jpg\",\"mediaType\":\"tv\",\"genre\":\"Action \u0026 adventure TV\",\"country\":\"United Kingdom\",\"description\":\"The Doctor is a Time Lord: a 900 year old alien with 2 hearts, part of a gifted civilization who mastered time travel. The Doctor saves planets for a living—more of a hobby actually, and the Doctor's very, very good at it.\",\"logo\":\"/img/t/p/w500/n7FjCJiZxL0UJTxhx3dNCsHTocX.png\"}]},{\"title\":\"Comedy TV\",\"items\":[{\"id\":79744,\"title\":\"The Rookie\",\"year\":\"2018\",\"releaseDate\":\"2018-10-16\",\"rating\":8.6,\"backdrop\":\"/img/t/p/w780/6iNWfGVCEfASDdlNb05TP5nG0ll.jpg\",\"poster\":\"/img/t/p/w500/70kTz0OmjjZe7zHvIDrq2iKW7PJ.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"Starting over isn't easy, especially for small-town guy John Nolan who, after a life-altering incident, is pursuing his dream of being an LAPD officer. As the force's oldest rookie, he's met with skepticism from some higher-ups who see him as just a walking midlife crisis.\",\"logo\":\"/img/t/p/w500/uXuEj4EgaE2mdeRODJoqw0k712I.png\"},{\"id\":60625,\"title\":\"Rick and Morty\",\"year\":\"2013\",\"releaseDate\":\"2013-12-02\",\"rating\":8.7,\"backdrop\":\"/img/t/p/w780/i4PpW1XyRlBuSNSIBRIIwSjEpjl.jpg\",\"poster\":\"/img/t/p/w500/owhkU6KRqdXoUQpjV8uyZGPtX58.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"Follows a sociopathic genius scientist who drags his inherently timid grandson on adventures across the universe.\",\"logo\":\"/img/t/p/w500/wq3wqFLwwqnhG6DxmSji9ehLcx6.png\"},{\"id\":22980,\"title\":\"Watch What Happens Live with Andy Cohen\",\"year\":\"2009\",\"releaseDate\":\"2009-07-16\",\"rating\":5,\"backdrop\":\"/img/t/p/w780/hINekSpbcBxjnjGqmIm6I4bz2ab.jpg\",\"poster\":\"/img/t/p/w500/onSD9UXfJwrMXWhq7UY7hGF2S1h.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"Bravo network executive Andy Cohen discusses pop culture topics with celebrities and reality show personalities.\",\"logo\":\"/img/t/p/w500/f7o8UibNBHJIlsT5REKmzYzsbaZ.png\"},{\"id\":299989,\"title\":\"Quiet Please!\",\"year\":\"2025\",\"releaseDate\":\"2025-09-02\",\"rating\":7.5,\"backdrop\":\"/img/t/p/w780/ihE0jp6V7R6dMwV7YrbYyjdQMvr.jpg\",\"poster\":\"/img/t/p/w500/hF9WdEMmEndkkBpOGSzez6Adjdw.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"South Korea\",\"description\":\"One month into living on his own, Yi-hyuk was hoping for an exciting, dramatic start to his independent life—but not this kind of drama. What he doesn’t expect is to be tormented by the thunderous noise coming from the apartment next door. Determined to put an end to it, he confronts his neighbor—only to make things infinitely worse when he accidentally punches him in the face.Yi-hyuk tries everything—from childish pranks to petty power plays—but his neighbor just won’t budge. He even pleads on his knees to make the noise stop. Just when it seems the feud will never end, they finally manage to call an uneasy truce.And somewhere along the way, Yi-hyuk realizes he might be falling for the very person who once drove him up the wall.\",\"logo\":\"/img/t/p/w500/3aPnywGkR8BwLYiu4a2CsUc9eVm.png\"},{\"id\":1434,\"title\":\"Family Guy\",\"year\":\"1999\",\"releaseDate\":\"1999-01-31\",\"rating\":7.4,\"backdrop\":\"/img/t/p/w780/l7wShoIdIUwaDIbsHno9pO5MZXT.jpg\",\"poster\":\"/img/t/p/w500/3PFsEuAiyLkWsP4GG6dIV37Q6gu.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"Sick, twisted, politically incorrect and Freakin' Sweet animated series featuring the adventures of the dysfunctional Griffin family. Bumbling Peter and long-suffering Lois have three kids. Stewie (a brilliant but sadistic baby bent on killing his mother and taking over the world), Meg (the oldest, and is the most unpopular girl in town) and Chris (the middle kid, he's not very bright but has a passion for movies). The final member of the family is Brian - a talking dog and much more than a pet, he keeps Stewie in check whilst sipping Martinis and sorting through his own life issues.\",\"logo\":\"/img/t/p/w500/d0qh15QxRMBigvAnuZ8bSaN02jS.png\"},{\"id\":456,\"title\":\"The Simpsons\",\"year\":\"1989\",\"releaseDate\":\"1989-12-17\",\"rating\":8,\"backdrop\":\"/img/t/p/w780/jIArNHIekrCSVgdMbKPAXpPY03Y.jpg\",\"poster\":\"/img/t/p/w500/uWpG7GqfKGQqX4YMAo3nv5OrglV.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"Set in Springfield, the average American town, the show focuses on the antics and everyday adventures of the Simpson family; Homer, Marge, Bart, Lisa and Maggie, as well as a virtual cast of thousands. Since the beginning, the series has been a pop culture icon, attracting hundreds of celebrities to guest star. The show has also made name for itself in its fearless satirical take on politics, media and American life in general.\",\"logo\":\"/img/t/p/w500/heDwFJx51IiBSJtjA1JYcWOXy7M.png\"},{\"id\":59941,\"title\":\"The Tonight Show Starring Jimmy Fallon\",\"year\":\"2014\",\"releaseDate\":\"2014-02-17\",\"rating\":5.8,\"backdrop\":\"/img/t/p/w780/7VO04TtL1jIT6XOPs9u4jdB8KaB.jpg\",\"poster\":\"/img/t/p/w500/1N4o5PmmqhlVDrcdJ2RlCFWbLGX.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"After Jay Leno's second retirement from the program, Jimmy Fallon stepped in as his permanent replacement. After 42 years in Los Angeles the program was brought back to New York.\",\"logo\":\"/img/t/p/w500/bZuZXBYdQC0wq5Xa3TT1p30TMfy.png\"},{\"id\":34307,\"title\":\"Shameless\",\"year\":\"2011\",\"releaseDate\":\"2011-01-09\",\"rating\":8.2,\"backdrop\":\"/img/t/p/w780/5s9XHTB9SLPdg3mNU6BlSLnZ9Qq.jpg\",\"poster\":\"/img/t/p/w500/ifo31fMWLmyOVpdak9K0kY4jldQ.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"Chicagoan Frank Gallagher is the proud single dad of six smart, industrious, independent kids, who without him would be... perhaps better off. When Frank's not at the bar spending what little money they have, he's passed out on the floor. But the kids have found ways to grow up in spite of him. They may not be like any family you know, but they make no apologies for being exactly who they are.\",\"logo\":\"/img/t/p/w500/mwTXcvhEb2JH3DzdFuXo45w6kIB.png\"},{\"id\":63770,\"title\":\"The Late Show with Stephen Colbert\",\"year\":\"2015\",\"releaseDate\":\"2015-09-08\",\"rating\":6.1,\"backdrop\":\"/img/t/p/w780/gMMnf8VRg3Z98WaFmOLr9Jk8pIs.jpg\",\"poster\":\"/img/t/p/w500/9jkThAGYj2yp8jsS6Nriy5mzKFT.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"Stephen Colbert brings his signature satire and comedy to The Late Show with Stephen Colbert, the #1 show in late night, where he talks with an eclectic mix of guests about what is new and relevant in the worlds of politics, entertainment, business, music, technology, and more. Featuring bandleader Jon Batiste with his band Stay Human, the Emmy Award-nominated show is broadcast from the historic Ed Sullivan Theater.\",\"logo\":\"/img/t/p/w500/wdjsrCJWXtwNpW9NmtpcTJqOCNY.png\"},{\"id\":14424,\"title\":\"Young Hearts\",\"year\":\"1995\",\"releaseDate\":\"1995-04-24\",\"rating\":6.3,\"backdrop\":\"/img/t/p/w780/7Vpk75SxS86Ai7o2iilJUz5rx4x.jpg\",\"poster\":\"/img/t/p/w500/bF24r2FxsjzgkJcrbBU8RC9JVoU.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"Brazil\",\"description\":\"Malhação is a Brazilian television series for the teenage audience. The soap started in 1995, and was set in a fictional Gym Club called Malhação on Barra da Tijuca, Rio de Janeiro. Through the years the location varied slightly. Although the name of the soap remains the same, it is now set in the Múltipla Escolha High School.\",\"logo\":\"\"},{\"id\":45140,\"title\":\"Teen Titans Go!\",\"year\":\"2013\",\"releaseDate\":\"2013-04-23\",\"rating\":6.4,\"backdrop\":\"/img/t/p/w780/bIHCUqaapZdRjd2kzSDiwzYyrpC.jpg\",\"poster\":\"/img/t/p/w500/kPKAigYUlWRpnfo4Ptiwlz4FWXU.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"Robin, Starfire, Raven, Beast Boy and Cyborg return in all-new, comedic adventures. They may be super heroes who save the world every day ... but somebody still has to do the laundry!\",\"logo\":\"/img/t/p/w500/wNzEpJMqiV4sJeAo3iQb6IAKyyb.png\"},{\"id\":1668,\"title\":\"Friends\",\"year\":\"1994\",\"releaseDate\":\"1994-09-22\",\"rating\":8.4,\"backdrop\":\"/img/t/p/w780/l0qVZIpXtIo7km9u5Yqh0nKPOr5.jpg\",\"poster\":\"/img/t/p/w500/2koX1xLkpTQM4IZebYvKysFW1Nh.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"Six young people from New York City, on their own and struggling to survive in the real world, find the companionship, comfort and support they get from each other to be the perfect antidote to the pressures of life.\",\"logo\":\"/img/t/p/w500/blVfE2u4uytU0f8yUO2XvhNSS2Y.png\"},{\"id\":502,\"title\":\"Sesame Street\",\"year\":\"1969\",\"releaseDate\":\"1969-11-10\",\"rating\":7.1,\"backdrop\":\"/img/t/p/w780/tNi2aJPdCKfielGYzIi3IKxStz9.jpg\",\"poster\":\"/img/t/p/w500/14k9BfZ2p4rQBMeJ5crKTfUZVwD.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"On a special inner city street, the inhabitants—human and muppet—teach preschoolers basic educational and social concepts using comedy, cartoons, games, and songs.\",\"logo\":\"/img/t/p/w500/b4ZhunEpCI8NsPP4UeUs3spN6U.svg\"},{\"id\":61818,\"title\":\"Late Night with Seth Meyers\",\"year\":\"2014\",\"releaseDate\":\"2014-02-25\",\"rating\":5.1,\"backdrop\":\"/img/t/p/w780/dfX2UaHVE5c7kLBFbgmEZJuy4Ev.jpg\",\"poster\":\"/img/t/p/w500/u8VruEGv7mtyJihVn2CSA1u90pk.jpg\",\"mediaType\":\"tv\",\"genre\":\"Comedy TV\",\"country\":\"United States\",\"description\":\"Seth Meyers, who is \\\"Saturday Night Live's\\\" longest serving anchor on the show's wildly popular \\\"Weekend Update,\\\" takes over as host of NBC's \\\"Late Night\\\" — home to A-list celebrity guests, memorable comedy and the best in musical talent. As the Emmy Award-winning head writer for \\\"SNL,\\\" Meyers has established a reputation for sharp wit and perfectly timed comedy, and has gained fame for his spot-on jokes and satire. Meyers takes his departure from \\\"SNL\\\" to his new post at \\\"Late Night,\\\" as Jimmy Fallon moves to \\\"The Tonight Show\\\".\",\"logo\":\"/img/t/p/w500/meaUZYwTQpDpre8tbI8bXme9niX.png\"}]},{\"title\":\"Drama TV\",\"items\":[{\"id\":5920,\"title\":\"The Mentalist\",\"year\":\"2008\",\"releaseDate\":\"2008-09-23\",\"rating\":8.4,\"backdrop\":\"/img/t/p/w780/q3pCsNvJ7CmdJUz2sJEEUY3pOPC.jpg\",\"poster\":\"/img/t/p/w500/acYXu4KaDj1NIkMgObnhe4C4a0T.jpg\",\"mediaType\":\"tv\",\"genre\":\"Drama TV\",\"country\":\"United States\",\"description\":\"Patrick Jane, a former celebrity psychic medium, uses "movie\",\"genre\":\"Apple TV+\",\"country\":\"United States\",\"description\":\"Dan Morgan is many things: a devoted husband, a loving father, a celebrated car salesman. He's also a former assassin. And when his past catches up to his present, he's forced to take his unsuspecting family on a road trip unlike any other.\",\"logo\":\"/img/t/p/w500/wbtc9YoxJjKgxytBgYeYoPnpDt6.png\"},{\"id\":1363123,\"title\":\"The Family Plan 2\",\"year\":\"2025\",\"releaseDate\":\"2025-11-11\",\"rating\":6.5,\"backdrop\":\"/img/t/p/w780/7nAVXGHHtaNcdsqvDXmY6R9N0fG.jpg\",\"poster\":\"/img/t/p/w500/semFxuYx6HcrkZzslgAkBqfJvZk.jpg\",\"mediaType\":\"movie\",\"genre\":\"Apple TV+\",\"country\":\"United States\",\"description\":\"Now that Dan's assassin days are behind him, all he wants for Christmas is quality time with his kids. But when he learns his daughter has her own plans, he books a family trip to London—putting them all in the crosshairs of an unexpected enemy.\",\"logo\":\"/img/t/p/w500/1q6ammsacEogl12l2ApOiGgjTGJ.png\"},{\"id\":776503,\"title\":\"CODA\",\"year\":\"2021\",\"releaseDate\":\"2021-08-13\",\"rating\":7.9,\"backdrop\":\"/img/t/p/w780/v85FlkbMYKa5du1glm0YfYNsL2n.jpg\",\"poster\":\"/img/t/p/w500/BzVjmm8l23rPsijLiNLUzuQtyd.jpg\",\"mediaType\":\"movie\",\"genre\":\"Apple TV+\",\"country\":\"United States\",\"description\":\"As a CODA (Child of Deaf Adults), Ruby is the only hearing person in her deaf family. When the family's fishing business is threatened, Ruby finds herself torn between pursuing her love of music and her fear of abandoning her parents.\",\"logo\":\"/img/t/p/w500/8lkrncCb8UMVVi4E3dZX3l5lg4I.svg\"},{\"id\":632856,\"title\":\"Spirited\",\"year\":\"2022\",\"releaseDate\":\"2022-11-10\",\"rating\":6.8,\"backdrop\":\"/img/t/p/w780/fHDvGGPFry65ou79WLi6JsjCZrM.jpg\",\"poster\":\"/img/t/p/w500/h3zAzTMs5EP3cKusOxFNGSFE1WI.jpg\",\"mediaType\":\"movie\",\"genre\":\"Apple TV+\",\"country\":\"United States\",\"description\":\"Each Christmas Eve, the Ghost of Christm ot tied to a mysterious video, Reef preemptively sets out on a redemption tour to make amends, confront his demons, and avoid getting canceled.\",\"logo\":\"/img/t/p/w500/3joHPfzLAFMoUtKWLEZq5e6DQpi.png\"},{\"id\":1097311,\"title\":\"Echo Valley\",\"year\":\"2025\",\"releaseDate\":\"2025-06-13\",\"rating\":6.4,\"backdrop\":\"/img/t/p/w780/aQ5nvQGT6mM6TliOM5iSgrKVF4C.jpg\",\"poster\":\"/img/t/p/w500/AsqALJWqGRgnKEo3gt1TCOF4nCM.jpg\",\"mediaType\":\"movie\",\"genre\":\"Apple TV+\",\"country\":\"United States\",\"description\":\"Kate lives a secluded life—until her troubled daughter shows up, frightened and covered in someone else's blood. As Kate unravels the shocking truth, she learns just how far a mother will go to try to save her child.\",\"logo\":\"/img/t/p/w500/ryopo6lf7pobwiN9fG7bvL7RMb9.png\"}]},{\"id\":283,\"name\":\"Crunchyroll\",\"items\":[{\"id\":378064,\"title\":\"A Silent Voice: The Movie\",\"year\":\"2016\",\"releaseDate\":\"2016-09-17\",\"rating\":8.4,\"backdrop\":\"/img/t/p/w780/5lAMQMWpXMsirvtLLvW7cJgEPkU.jpg\",\"poster\":\"/img/t/p/w500/tuFaWiqX0TXoWu7DGNcmX3UW7sT.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"Japan\",\"description\":\"Shouya Ishida starts bullying the new girl in class, Shouko Nishimiya, because she is deaf. But as the teasing continues, the rest of the class starts to turn on Shouya for his lack of compassion. When they leave elementary school, Shouko and Shouya do not speak to each other again... until an older, wiser Shouya, tormented by his past behaviour, decides he must see Shouko once more. He wants to atone for his sins, but is it already too late...?\",\"logo\":\"/img/t/p/w500/59w18SQ1tkOB3V11Gqo4vvMMego.png\"},{\"id\":149,\"title\":\"Akira\",\"year\":\"1988\",\"releaseDate\":\"1988-06-10\",\"rating\":7.9,\"backdrop\":\"/img/t/p/w780/fK40VGYIm7hmKrLJ26fgPQU0qRG.jpg\",\"poster\":\"/img/t/p/w500/neZ0ykEsPqxamsX6o5QNUFILQrz.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"Japan\",\"description\":\"A secret military project endangers Neo-Tokyo when it turns a biker gang member into a rampaging psychic psychopath that only two teenagers and a group of psychics can stop.\",\"logo\":\"/img/t/p/w500/AbcUfIbGRwrlPqdmTSi2WzArjQh.png\"},{\"id\":916224,\"title\":\"Suzume\",\"year\":\"2022\",\"releaseDate\":\"2022-11-11\",\"rating\":7.9,\"backdrop\":\"/img/t/p/w780/4tdV5AeojEdbvn6VpeQrbuDlmzs.jpg\",\"poster\":\"/img/t/p/w500/yStW1TXF5s7Tbtu9KjIZEaWl6HL.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"Japan\",\"description\":\"Suzume, 17, lost her mother as a little girl. On her way to school, she meets a mysterious young man. But her curiosity unleashes a calamity that endangers the entire population of Japan, and so Suzume embarks on a journey to set things right.\",\"logo\":\"/img/t/p/w500/q543yE9gmhqbMkVUtwE0YzRFMzO.png\"},{\"id\":620249,\"title\":\"The Legend of Hei\",\"year\":\"2019\",\"releaseDate\":\"2019-08-27\",\"rating\":8.4,\"backdrop\":\"/img/t/p/w780/aVFx1VtlOxR3v0ADEatalXOvwbu.jpg\",\"poster\":\"/img/t/p/w500/nWdES36hGwADWWBGzvgT1Z3Xn86.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"China\",\"description\":\"When cat spirit Luo Xiaohei's home is deforested by humans, he must find a new one. He runs into a group of other spirit creatures who take him under their wing with dreams of reconquering the land they say is rightfully theirs. However, they run into a human known as Wuxian who separates Luo Xiaohei from the other spirits and the two go on a journey, with the cat spirit learning to control his abilities as well as forming his own thoughts on whether or not he should ally with the spirits or the humans.\",\"logo\":\"/img/t/p/w500/jf9PitJ6qPAB1qmkpN1RuoqXIOk.png\"},{\"id\":810693,\"title\":\"Jujutsu Kaisen 0\",\"year\":\"2021\",\"releaseDate\":\"2021-12-24\",\"rating\":8.1,\"backdrop\":\"/img/t/p/w780/rcEDPOOOUTLFxLLQJggfLffbofe.jpg\",\"poster\":\"/img/t/p/w500/23oJaeBh0FDk2mQ2P240PU9Xxfh.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"Japan\",\"description\":\"Yuta Okkotsu is a nervous high school student who is suffering from a serious problem—his childhood friend Rika has turned into a curse and won't leave him alone. Since Rika is no ordinary curse, his plight is noticed by Satoru Gojo, a teacher at Jujutsu High, a school where fledgling exorcists learn how to combat curses. Gojo convinces Yuta to enroll, but can he learn enough in time to confront the curse that haunts him?\",\"logo\":\"/img/t/p/w500/4clQNTdrIUFJAFTIpguGwO2ldgi.png\"},{\"id\":1159311,\"title\":\"My Hero Academia: You're Next\",\"year\":\"2024\",\"releaseDate\":\"2024-08-02\",\"rating\":7.2,\"backdrop\":\"/img/t/p/w780/tUbwMOYP4cuGL1sQ0edz5943rBY.jpg\",\"poster\":\"/img/t/p/w500/tTrI6PwqzxkgO3dvQ7BEKXM7SYR.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"Japan\",\"description\":\"In a society devastated by the effects of an all-out war between heroes and villains, a mysterious giant fortress suddenly appears, engulfing towns and people one after another. Then, a man reminiscent of All Might, the 'symbol of peace', stands in front of Izuku and his friends...\",\"logo\":\"/img/t/p/w500/cCf1pAVXhKNXMgqp8sbZj36CEK5.png\"},{\"id\":820067,\"title\":\"The Quintessential Quintuplets Movie\",\"year\":\"2022\",\"releaseDate\":\"2022-05-20\",\"rating\":8.3,\"backdrop\":\"/img/t/p/w780/gcgKSyE2iqwfKWMDZ8TJPxeIu0P.jpg\",\"poster\":\"/img/t/p/w500/sg7klpt1xwK1IJirBI9EHaqQwJ5.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"Japan\",\"description\":\"When five lovely young girls who hate studying hire part-time tutor Futaro, he guides not only their education but also their hearts. Time spent has brought them all closer, with feelings growing within the girls and Futaro. As they finish their third year of high school and their last school festival approaches, they set their sights on what’s next. Is there a future with one of them and Futaro?\",\"logo\":\"/img/t/p/w500/wT45TqWKuy2EeAazTU3dMMSmEwi.png\"},{\"id\":592350,\"title\":\"My Hero Academia: Heroes Rising\",\"year\":\"2019\",\"releaseDate\":\"2019-12-20\",\"rating\":8.1,\"backdrop\":\"/img/t/p/w780/9guoVF7zayiiUq5ulKQpt375VIy.jpg\",\"poster\":\"/img/t/p/w500/kpWsIkfXrnQ1pmR79qAHHq7DPxc.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"Japan\",\"description\":\"Class 1-A visits Nabu Island where they finally get to do some real hero work. The place is so peaceful that it's more like a vacation... until they're attacked by a villain with an unfathomable Quirk! His power is eerily familiar, and it looks like Shigaraki had a hand in the plan. But with All Might retired and citizens' lives on the line, there's no time for questions. Deku and his friends are the next generation of heroes, and they're the island's only hope.\",\"logo\":\"/img/t/p/w500/2mnZVWcdZRXmTvnI6ptXPBuqTXk.png\"},{\"id\":652837,\"title\":\"Josee, the Tiger and the Fish\",\"year\":\"2020\",\"releaseDate\":\"2020-12-25\",\"rating\":8.3,\"backdrop\":\"/img/t/p/w780/521koHpCyK6ZeNpEAvPAuC75cJ5.jpg\",\"poster\":\"/img/t/p/w500/z1D8xi9x4uEhyFruo7uEHXUMD4K.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"Japan\",\"description\":\"With dreams of diving abroad, Tsuneo gets a job assisting Josee, an artist whose imagination takes her far beyond her wheelchair. But when the tide turns against them, they push each other to places they never thought possible, and inspire a love fit for a storybook.\",\"logo\":\"/img/t/p/w500/v0shZPByCvy32331NMWzEamygAV.png\"},{\"id\":876792,\"title\":\"That Time I Got Reincarnated as a Slime the Movie: Scarlet Bond\",\"year\":\"2022\",\"releaseDate\":\"2022-11-25\",\"rating\":7.4,\"backdrop\":\"/img/t/p/w780/g03h9TULzJZOoXA34Abp5LE7lvt.jpg\",\"poster\":\"/img/t/p/w500/xITip9n9uMAUA0TU6niMXU2tbh0.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"Japan\",\"description\":\"A long-running conspiracy is swirling over a mysterious power wielded by the Queen in Raja, a small country west of Tempest. When a slime who evolved into a Demon Lord named Rimuru Tempest crosses paths with Hiiro, a survivor of the Ogre race, an incredible adventure packed with new characters begins. The power of bonds will be put to the test!\",\"logo\":\"/img/t/p/w500/odSsbUhZtavQw7SAOfR7OQ1tu63.png\"},{\"id\":303857,\"title\":\"Dragon Ball Z: Resurrection 'F'\",\"year\":\"2015\",\"releaseDate\":\"2015-04-18\",\"rating\":6.9,\"backdrop\":\"/img/t/p/w780/usrUizny0dLNJTrrJSxsvu5V0z0.jpg\",\"poster\":\"/img/t/p/w500/soq3AxjALdBfdPAm8H7yuMmNL5Y.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"Japan\",\"description\":\"One peaceful day on Earth, two remnants of Frieza's army named Sorbet and Tagoma arrive searching for the Dragon Balls with the aim of reviving Frieza. They succeed, and Frieza subsequently seeks revenge on the Saiyans.\",\"logo\":\"/img/t/p/w500/kR8iaPVbblBe0miBjeFEkpU7Xhy.png\"},{\"id\":1014505,\"title\":\"OVERLORD: The Sacred Kingdom\",\"year\":\"2024\",\"releaseDate\":\"2024-09-20\",\"rating\":7.8,\"backdrop\":\"/img/t/p/w780/hkJhGayONXn96CqIRM9GhWKnlCf.jpg\",\"poster\":\"/img/t/p/w500/jEvytxNa5mfW7VAUmDWsZtIdATc.jpg\",\"mediaType\":\"movie\",\"genre\":\"Crunchyroll\",\"country\":\"Japan\",\"description\":\"Facing possible annihilation by the Demon Emperor's demi-human army, the Sacred Kingdom reluctantly seeks aid from the feared, undead Sorcerer King Ainz.\",\"logo\":\"/img/t/p/w500/pwGf0BA1qAtQa3DiR7MN2Dr7SM4.png\"}]}]}}]\n"])</script></body></html>
